<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/static/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14101c" media="(prefers-color-scheme: dark)" />
    <title>THU GPA Helper</title>
    <script>
      // 页面渲染前确定主题，避免深色模式下的白屏闪烁
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
